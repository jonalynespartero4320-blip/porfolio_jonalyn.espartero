<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-label="IMS system flowchart">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#149aa0"/>
      <stop offset="1" stop-color="#07346c"/>
    </linearGradient>
    <style>
      .title{font:700 30px Arial,Helvetica,sans-serif;fill:#fff}
      .sub{font:400 15px Arial,Helvetica,sans-serif;fill:#e9fbff}
      .box{fill:#fff;stroke:#dbe4ef;stroke-width:2;rx:12}
      .label{font:700 17px Arial,Helvetica,sans-serif;fill:#142233}
      .small{font:400 13px Arial,Helvetica,sans-serif;fill:#5f6b7a}
      .arrow{stroke:#149aa0;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#149aa0"/>
    </marker>
  </defs>
  <rect width="1100" height="760" fill="#eef3f7"/>
  <rect x="40" y="34" width="1020" height="96" rx="20" fill="url(#head)"/>
  <text x="70" y="84" class="title">IMS System Flowchart</text>
  <text x="70" y="108" class="sub">Login, module access, record processing, reports, and audit monitoring</text>

  <rect class="box" x="90" y="180" width="220" height="82"/>
  <text class="label" x="126" y="216">User Login</text>
  <text class="small" x="126" y="240">Validate credentials</text>

  <rect class="box" x="440" y="180" width="220" height="82"/>
  <text class="label" x="475" y="216">Role Access</text>
  <text class="small" x="475" y="240">Load permissions</text>

  <rect class="box" x="790" y="180" width="220" height="82"/>
  <text class="label" x="824" y="216">Dashboard</text>
  <text class="small" x="824" y="240">View overview</text>

  <path class="arrow" d="M310 221 H440"/>
  <path class="arrow" d="M660 221 H790"/>

  <rect class="box" x="90" y="350" width="220" height="94"/>
  <text class="label" x="128" y="386">Requests</text>
  <text class="small" x="128" y="410">Equipment or service</text>
  <text class="small" x="128" y="428">Submit and monitor</text>

  <rect class="box" x="440" y="350" width="220" height="94"/>
  <text class="label" x="480" y="386">Inventory</text>
  <text class="small" x="480" y="410">Equipment and supplies</text>
  <text class="small" x="480" y="428">Add, edit, archive</text>

  <rect class="box" x="790" y="350" width="220" height="94"/>
  <text class="label" x="838" y="386">Assign</text>
  <text class="small" x="838" y="410">Assign equipment</text>
  <text class="small" x="838" y="428">Upload PDF</text>

  <path class="arrow" d="M900 262 V306 H200 V350"/>
  <path class="arrow" d="M900 306 H550 V350"/>
  <path class="arrow" d="M900 306 V350"/>

  <rect class="box" x="90" y="530" width="220" height="94"/>
  <text class="label" x="132" y="566">Reports</text>
  <text class="small" x="132" y="590">Filter, print, PDF</text>
  <text class="small" x="132" y="608">Excel export</text>

  <rect class="box" x="440" y="530" width="220" height="94"/>
  <text class="label" x="474" y="566">Masterlists</text>
  <text class="small" x="474" y="590">Maintain dropdown</text>
  <text class="small" x="474" y="608">reference values</text>

  <rect class="box" x="790" y="530" width="220" height="94"/>
  <text class="label" x="840" y="566">Admin</text>
  <text class="small" x="840" y="590">Users, roles, logs</text>
  <text class="small" x="840" y="608">reset approvals</text>

  <path class="arrow" d="M200 444 V530"/>
  <path class="arrow" d="M550 444 V530"/>
  <path class="arrow" d="M900 444 V530"/>
  <path class="arrow" d="M310 577 H440"/>
  <path class="arrow" d="M660 577 H790"/>
</svg>
