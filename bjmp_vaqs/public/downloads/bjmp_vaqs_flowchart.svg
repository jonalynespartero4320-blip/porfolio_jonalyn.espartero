<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="brand" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#061311"/>
      <stop offset="52%" stop-color="#1d5c78"/>
      <stop offset="100%" stop-color="#2d7a39"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" x2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0" x2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1d5c78"/>
    </marker>
    <style>
      .title { font: 800 38px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .subtitle { font: 600 17px "Segoe UI", Arial, sans-serif; fill: rgba(255,255,255,.86); }
      .lane-title { font: 800 18px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .step-title { font: 800 17px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .body { font: 500 13.5px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .small { font: 700 12px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .tag { font: 800 11px "Segoe UI", Arial, sans-serif; fill: #fff; letter-spacing: .08em; }
      .num { font: 900 16px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .decision { font: 800 14px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .footer { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#eef4f6"/>
  <rect x="44" y="34" width="1512" height="126" rx="28" fill="url(#brand)" filter="url(#shadow)"/>
  <text x="84" y="84" class="title">BJMP VAQS Complete Process Flowchart</text>
  <text x="84" y="118" class="subtitle">Simple end-to-end process for records setup, visitor registration, ID issuance, queue admission, monitoring, reports, and governance.</text>
  <text x="84" y="145" class="subtitle">Daily controls: one visitor ID = one visit per day, maximum ten visitors inside, visitor board resets daily.</text>

  <rect x="44" y="184" width="1512" height="742" rx="26" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Lane headers -->
  <g transform="translate(74 214)">
    <rect width="250" height="42" rx="16" fill="#e2e8f0"/>
    <text x="18" y="27" class="lane-title">1. Access &amp; Governance</text>
  </g>
  <g transform="translate(365 214)">
    <rect width="250" height="42" rx="16" fill="#e2e8f0"/>
    <text x="18" y="27" class="lane-title">2. Records Setup</text>
  </g>
  <g transform="translate(656 214)">
    <rect width="250" height="42" rx="16" fill="#e2e8f0"/>
    <text x="18" y="27" class="lane-title">3. Visitor Processing</text>
  </g>
  <g transform="translate(947 214)">
    <rect width="250" height="42" rx="16" fill="#e2e8f0"/>
    <text x="18" y="27" class="lane-title">4. Queue Admission</text>
  </g>
  <g transform="translate(1238 214)">
    <rect width="250" height="42" rx="16" fill="#e2e8f0"/>
    <text x="18" y="27" class="lane-title">5. Monitoring &amp; Reports</text>
  </g>

  <!-- Access -->
  <g transform="translate(74 286)">
    <rect width="250" height="88" rx="18" fill="url(#softBlue)" stroke="#cbd5e1"/>
    <rect x="14" y="17" width="44" height="44" rx="14" fill="url(#brand)"/>
    <text x="28" y="45" class="num">01</text>
    <text x="72" y="34" class="step-title">User Account</text>
    <text x="72" y="57" class="body">Register account or login.</text>
    <text x="72" y="76" class="body">Forgot password requests go to admin.</text>
  </g>
  <line x1="199" y1="374" x2="199" y2="424" stroke="#1d5c78" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(74 434)">
    <rect width="250" height="98" rx="18" fill="url(#softGreen)" stroke="#bbf7d0"/>
    <rect x="14" y="22" width="44" height="44" rx="14" fill="url(#brand)"/>
    <text x="28" y="50" class="num">02</text>
    <text x="72" y="36" class="step-title">Role Approval</text>
    <text x="72" y="59" class="body">Super admin assigns role and permissions.</text>
    <text x="72" y="78" class="body">Buttons open only if permission is granted.</text>
  </g>

  <!-- Setup -->
  <line x1="324" y1="483" x2="365" y2="483" stroke="#1d5c78" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(365 286)">
    <rect width="250" height="88" rx="18" fill="url(#softBlue)" stroke="#cbd5e1"/>
    <rect x="14" y="17" width="44" height="44" rx="14" fill="url(#brand)"/>
    <text x="28" y="45" class="num">03</text>
    <text x="72" y="34" class="step-title">Masterlist</text>
    <text x="72" y="57" class="body">Encode cases, courts, and dorms.</text>
    <text x="72" y="76" class="body">Used by PDL, reports, and queue.</text>
  </g>
  <line x1="490" y1="374" x2="490" y2="424" stroke="#1d5c78" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(365 434)">
    <rect width="250" height="118" rx="18" fill="url(#softGreen)" stroke="#bbf7d0"/>
    <rect x="14" y="26" width="44" height="44" rx="14" fill="url(#brand)"/>
    <text x="28" y="54" class="num">04</text>
    <text x="72" y="34" class="step-title">PDL Management</text>
    <text x="72" y="57" class="body">Add/import PDL records.</text>
    <text x="72" y="76" class="body">Add 5 authorized visitors from PDL.</text>
    <text x="72" y="95" class="body">PDL ID sequence follows PDL gender.</text>
  </g>

  <!-- Visitor Processing -->
  <line x1="615" y1="493" x2="656" y2="493" stroke="#1d5c78" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(656 286)">
    <rect width="250" height="108" rx="18" fill="url(#softBlue)" stroke="#cbd5e1"/>
    <rect x="14" y="25" width="44" height="44" rx="14" fill="url(#brand)"/>
    <text x="28" y="53" class="num">05</text>
    <text x="72" y="34" class="step-title">Visitor Registration</text>
    <text x="72" y="57" class="body">Select PDL and authorized visitor.</text>
    <text x="72" y="76" class="body">Encode details, photo, documents,</text>
    <text x="72" y="95" class="body">and emergency contact.</text>
  </g>
  <line x1="781" y1="394" x2="781" y2="432" stroke="#1d5c78" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(681 438)">
    <polygon points="100,0 200,62 100,124 0,62" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="52" y="56" class="decision">Complete</text>
    <text x="48" y="76" class="decision">documents?</text>
  </g>
  <path d="M681 500 C642 500 632 578 666 607" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="625" y="544" class="small">No: update files</text>
  <line x1="781" y1="562" x2="781" y2="612" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="792" y="594" class="small">Yes</text>
  <g transform="translate(656 622)">
    <rect width="250" height="98" rx="18" fill="url(#softGreen)" stroke="#bbf7d0"/>
    <rect x="14" y="22" width="44" height="44" rx="14" fill="url(#brand)"/>
    <text x="28" y="50" class="num">06</text>
    <text x="72" y="36" class="step-title">Visitor Management</text>
    <text x="72" y="59" class="body">Verify visitor, update records,</text>
    <text x="72" y="78" class="body">manage bans and emergency contact.</text>
  </g>

  <!-- Queue admission -->
  <line x1="906" y1="671" x2="947" y2="671" stroke="#1d5c78" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(947 286)">
    <rect width="250" height="98" rx="18" fill="url(#softBlue)" stroke="#cbd5e1"/>
    <rect x="14" y="22" width="44" height="44" rx="14" fill="url(#brand)"/>
    <text x="28" y="50" class="num">07</text>
    <text x="72" y="36" class="step-title">ID Issuance</text>
    <text x="72" y="59" class="body">Issue/reissue QR visitor ID.</text>
    <text x="72" y="78" class="body">Print PVC or export PDF.</text>
  </g>
  <line x1="1072" y1="384" x2="1072" y2="424" stroke="#1d5c78" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(947 434)">
    <rect width="250" height="108" rx="18" fill="url(#softGreen)" stroke="#bbf7d0"/>
    <rect x="14" y="25" width="44" height="44" rx="14" fill="url(#brand)"/>
    <text x="28" y="53" class="num">08</text>
    <text x="72" y="34" class="step-title">Queue Request</text>
    <text x="72" y="57" class="body">Scan QR, validate visitor, add queue.</text>
    <text x="72" y="76" class="body">ID details are optional.</text>
    <text x="72" y="95" class="body">Special case can be approved.</text>
  </g>
  <line x1="1072" y1="542" x2="1072" y2="584" stroke="#1d5c78" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(972 590)">
    <polygon points="100,0 200,62 100,124 0,62" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="36" y="48" class="decision">Valid, not banned,</text>
    <text x="48" y="68" class="decision">one visit today,</text>
    <text x="50" y="88" class="decision">slot available?</text>
  </g>
  <path d="M972 652 C912 652 912 758 971 758" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="884" y="704" class="small">No: reject or wait</text>
  <line x1="1072" y1="714" x2="1072" y2="748" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1084" y="740" class="small">Yes</text>
  <g transform="translate(947 758)">
    <rect width="250" height="98" rx="18" fill="url(#softBlue)" stroke="#cbd5e1"/>
    <rect x="14" y="22" width="44" height="44" rx="14" fill="url(#brand)"/>
    <text x="28" y="50" class="num">09</text>
    <text x="72" y="36" class="step-title">Admission</text>
    <text x="72" y="59" class="body">Accept visitor inside.</text>
    <text x="72" y="78" class="body">Time out after visit completion.</text>
  </g>

  <!-- Monitoring -->
  <line x1="1197" y1="807" x2="1238" y2="807" stroke="#1d5c78" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(1238 286)">
    <rect width="250" height="108" rx="18" fill="url(#softBlue)" stroke="#cbd5e1"/>
    <rect x="14" y="25" width="44" height="44" rx="14" fill="url(#brand)"/>
    <text x="28" y="53" class="num">10</text>
    <text x="72" y="34" class="step-title">Visitor Board</text>
    <text x="72" y="57" class="body">Public display shows waiting and</text>
    <text x="72" y="76" class="body">inside visitors only, with masked</text>
    <text x="72" y="95" class="body">names for privacy.</text>
  </g>
  <g transform="translate(1238 434)">
    <rect width="250" height="108" rx="18" fill="url(#softGreen)" stroke="#bbf7d0"/>
    <rect x="14" y="25" width="44" height="44" rx="14" fill="url(#brand)"/>
    <text x="28" y="53" class="num">11</text>
    <text x="72" y="34" class="step-title">Admin Monitor</text>
    <text x="72" y="57" class="body">Admin sees waiting, inside,</text>
    <text x="72" y="76" class="body">completed, rejected, capacity,</text>
    <text x="72" y="95" class="body">and average wait details.</text>
  </g>
  <g transform="translate(1238 582)">
    <rect width="250" height="108" rx="18" fill="url(#softBlue)" stroke="#cbd5e1"/>
    <rect x="14" y="25" width="44" height="44" rx="14" fill="url(#brand)"/>
    <text x="28" y="53" class="num">12</text>
    <text x="72" y="34" class="step-title">Reports</text>
    <text x="72" y="57" class="body">Filter by period, dorm, PDL,</text>
    <text x="72" y="76" class="body">PDL gender, banned records,</text>
    <text x="72" y="95" class="body">special cases, and fields.</text>
  </g>
  <g transform="translate(1238 730)">
    <rect width="250" height="126" rx="18" fill="url(#softGreen)" stroke="#bbf7d0"/>
    <rect x="14" y="34" width="44" height="44" rx="14" fill="url(#brand)"/>
    <text x="28" y="62" class="num">13</text>
    <text x="72" y="38" class="step-title">Audit Trail</text>
    <text x="72" y="61" class="body">Logs, record history, user roles,</text>
    <text x="72" y="80" class="body">permissions, and reset approvals</text>
    <text x="72" y="99" class="body">are controlled by super admin.</text>
  </g>

  <!-- Cross-flow arrows -->
  <path d="M781 720 C781 805 920 807 947 807" fill="none" stroke="#1d5c78" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1197 488 C1222 488 1222 340 1238 340" fill="none" stroke="#1d5c78" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1197 807 C1222 807 1222 636 1238 636" fill="none" stroke="#1d5c78" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="74" y="942" width="1418" height="62" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="100" y="968" class="footer">Process notes: PDL records are grouped by PDL gender. Visitor Management and Reports use linked PDL gender for gender tabs/filters. Deleting or editing key records is archived for traceability.</text>
  <text x="100" y="990" class="footer">Security notes: public board hides completed records and operational averages; action buttons require role-based permission approval.</text>
</svg>
