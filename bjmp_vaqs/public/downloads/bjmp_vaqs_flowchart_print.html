<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ID & Queuing System Flowchart</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 8mm;
    }
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef4f6;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .sheet {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: #eef4f6;
    }
    img {
      display: block;
      width: 100%;
      max-width: 281mm;
      max-height: 194mm;
      object-fit: contain;
    }
    @media print {
      .sheet {
        width: auto;
        min-height: auto;
      }
      img {
        width: 281mm;
        height: auto;
        max-height: 194mm;
      }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <img src="bjmp_vaqs_flowchart.svg" alt="ID & Queuing System Complete Process Flowchart">
  </main>
</body>
</html>
